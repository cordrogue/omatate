[package]
name = "ui-notes"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Lightweight floating notes for Wayland"
license = "MIT"

[dependencies]
serde_json = "1.0.151"
libc = "0.2.189"
toml = { version = "1.1.5", default-features = false, features = ["std", "serde", "parse"] }

[[bin]]
name = "ui-notes"
path = "src/bin/ui-notes.rs"

[[bin]]
name = "ui-notes-panel"
path = "src/bin/ui-notes-panel.rs"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
