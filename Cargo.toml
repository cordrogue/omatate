[package]
name = "omatate"
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
description = "Universal annotation for Omarchy"
license = "MIT"

[dependencies]
serde_json = "1.0.151"
libc = "0.2.189"
toml = { version = "1.1.5", default-features = false, features = ["std", "serde", "parse"] }

[[bin]]
name = "omatate"
path = "src/bin/omatate.rs"

[[bin]]
name = "omatate-panel"
path = "src/bin/omatate-panel.rs"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
